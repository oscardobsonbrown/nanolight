name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      previous: ${{ steps.plan.outputs.previous }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select the next release
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/release.py plan

  ci:
    needs: plan
    if: needs.plan.outputs.tag != '' && vars.RELEASE_ENABLED == 'true'
    uses: ./.github/workflows/ci.yml

  macos:
    needs: [plan, ci]
    runs-on: macos-15
    timeout-minutes: 45
    environment: release-signing
    outputs:
      team: ${{ steps.package.outputs.team }}
    env:
      VERSION: ${{ needs.plan.outputs.tag }}
      ZIG_FLAGS: -Dupdate-repo=${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.17.0

      - name: Sign, notarize and package
        id: package
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          AC_API_KEY_P8: ${{ secrets.AC_API_KEY_P8 }}
          AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
        run: |
          : "${MACOS_CERT_P12:?Set MACOS_CERT_P12 in release-signing}"
          : "${MACOS_CERT_PASSWORD:?Set MACOS_CERT_PASSWORD in release-signing}"
          : "${AC_API_KEY_P8:?Set AC_API_KEY_P8 in release-signing}"
          : "${AC_API_KEY_ID:?Set AC_API_KEY_ID in release-signing}"
          : "${AC_API_ISSUER_ID:?Set AC_API_ISSUER_ID in release-signing}"
          umask 077
          work=$(mktemp -d "$RUNNER_TEMP/signing.XXXXXX")
          keychain="$work/release.keychain-db"
          trap 'security delete-keychain "$keychain" || true; rm -rf "$work"' EXIT
          pass=$(uuidgen)
          security create-keychain -p "$pass" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$pass" "$keychain"
          printf '%s' "$MACOS_CERT_P12" | base64 --decode > "$work/cert.p12"
          security import "$work/cert.p12" -k "$keychain" \
            -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          rm "$work/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$pass" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          identity=$(security find-identity -v -p codesigning "$keychain" |
            awk '/"Developer ID Application: / {print $2; exit}')
          test -n "$identity"
          printf '%s' "$AC_API_KEY_P8" > "$work/notary.p8"
          export CODESIGN_IDENTITY="$identity"
          export NOTARY_KEY_PATH="$work/notary.p8"
          export NOTARY_KEY_ID="$AC_API_KEY_ID" NOTARY_ISSUER_ID="$AC_API_ISSUER_ID"
          unset MACOS_CERT_P12 MACOS_CERT_PASSWORD AC_API_KEY_P8 AC_API_KEY_ID AC_API_ISSUER_ID
          umask 022
          sh macos/package.sh
          app=zig-out/package/Nanolight.app
          codesign --verify --deep --strict "$app"
          team=$(codesign -dv --verbose=2 "$app" 2>&1 | sed -n 's/^TeamIdentifier=//p')
          [[ "$team" =~ ^[A-Z0-9]{10}$ ]]
          echo "team=$team" >> "$GITHUB_OUTPUT"

      - name: Package Windows and Linux
        run: sh pc/package.sh

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-packages
          if-no-files-found: error
          path: |
            zig-out/package/*.dmg
            zig-out/package/*.zip
            zig-out/package/*.tar.gz
            zig-out/package/*.sha256
            zig-out/package/manifest.json

  stage:
    needs: [plan, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-packages
          path: packages
      - name: Stage the packages and release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          PREVIOUS: ${{ needs.plan.outputs.previous }}
        run: |
          python3 .github/scripts/release.py notes > "$RUNNER_TEMP/release-notes.md"
          if gh release view "$TAG" --json isPrerelease,isDraft > "$RUNNER_TEMP/release-state.json"; then
            jq -e '.isPrerelease and (.isDraft | not)' "$RUNNER_TEMP/release-state.json" >/dev/null
            gh release edit "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --prerelease \
              --title "Nanolight ${TAG#v}" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          gh release upload "$TAG" packages/* --clobber

  verify:
    needs: [plan, macos, stage]
    uses: ./.github/workflows/verify-release.yml
    with:
      tag: ${{ needs.plan.outputs.tag }}
      from: ${{ needs.plan.outputs.previous }}
      team: ${{ needs.macos.outputs.team }}

  publish:
    needs: [plan, verify]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Mark the release as latest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease=false --latest
