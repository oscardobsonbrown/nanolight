# Checks a published release end to end on each macOS it promises to run on
# (macos/verify-release.sh: the files; macos/verify-update.sh: a real first
# launch, a real update from the release before, and a lying feed refused).
# release.yml calls this before a release reaches anyone; run it by hand on
# any release, and a change to these checks proves itself on its pull request
# against the newest release.
name: Verify release

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      from:
        type: string
        required: false
      team:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: "The release to check (default: the newest)"
        required: false
      from:
        description: "The release that updates to it (default: the one before)"
        required: false
  pull_request:
    paths:
      - macos/verify-release.sh
      - macos/verify-update.sh
      - .github/workflows/verify-release.yml

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      TEAM_ID: ${{ inputs.team }}
    steps:
      - uses: actions/checkout@v4

      - name: Which releases
        id: which
        env:
          GH_TOKEN: ${{ github.token }}
          TO: ${{ inputs.tag }}
          FROM: ${{ inputs.from }}
        run: |
          if [ -z "$TEAM_ID" ]; then
            published=$(gh release list --exclude-drafts --exclude-pre-releases --json tagName \
              --jq '.[].tagName')
            TO="${TO:-$(printf '%s\n' "$published" | sed -n '1p')}"
            FROM="${FROM:-$(printf '%s\n' "$published" | awk -v tag="$TO" 'found {print; exit} $0 == tag {found = 1}')}"
          fi
          echo "to=$TO" >> "$GITHUB_OUTPUT"
          echo "from=$FROM" >> "$GITHUB_OUTPUT"

      - name: The published files
        if: steps.which.outputs.to != ''
        env:
          TO: ${{ steps.which.outputs.to }}
        run: sh macos/verify-release.sh "$TO"

      - name: First launch, update, refusals
        if: steps.which.outputs.from != ''
        env:
          FROM: ${{ steps.which.outputs.from }}
          TO: ${{ steps.which.outputs.to }}
          SHOTS: ${{ runner.temp }}/shots
          # A pull request changes the checks, not the published build they
          # run on: there the typing check reports, and a release must pass it.
          TYPING_EXPECT: ${{ github.event_name == 'pull_request' && 'any' || 'clean' }}
        run: sh macos/verify-update.sh "$FROM" "$TO"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screens-${{ matrix.os }}
          path: ${{ runner.temp }}/shots
          if-no-files-found: ignore
